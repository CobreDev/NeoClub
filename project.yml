name: NeoClub
options:
  bundleIdPrefix: dev.cobre
  deploymentTarget:
    iOS: "26.2"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4BN7V65X8J
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    # Dev builds are build 0; scripts/make-release.sh sets the build number (YYMMDD, then .2, .3 … for more the same
    # day) and the commit it was built from.
    CURRENT_PROJECT_VERSION: "0"
    NEOCLUB_COMMIT: dev
targets:
  NeoClub:
    type: application
    platform: iOS
    sources:
      - path: NeoClub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cobre.aioclub
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AIO Club
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: NeoClub/Info.plist
      properties:
        UIBackgroundModes: [audio]
        NeoClubCommit: $(NEOCLUB_COMMIT)
        # The app's own navy (as its loading screen), so a launch never flashes the system's white or black first.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIAppFonts: [JacobyICGBlack.ttf, UniversRegular.ttf, UniversBold.ttf]
        UIUserInterfaceStyle: Automatic
  NeoClubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeoClubTests
    dependencies:
      - target: NeoClub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.cobre.aioclub.tests
schemes:
  NeoClub:
    build:
      targets:
        NeoClub: all
        NeoClubTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NeoClubTests
    archive:
      config: Release
